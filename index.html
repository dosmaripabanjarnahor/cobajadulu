<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PPT Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --nav-btn-size: 48px;
      --hamburger-size: 48px;
      --slide-gap: 12px;
      --slide-padding: 12px;
    }

    @media (min-width: 768px) {
      :root {
        --nav-btn-size: 52px;
        --hamburger-size: 52px;
        --slide-gap: 16px;
        --slide-padding: 16px;
      }
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      touch-action: pan-x;
    }

    /* ── SLIDES CONTAINER ── */
    .slides-container {
      display: flex;
      flex-direction: row;
      overflow-x: scroll;
      overflow-y: hidden;
      scroll-behavior: smooth;
      height: 100dvh;
      gap: 0;
      padding: 0;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      align-items: center;
    }
    .slides-container::-webkit-scrollbar { display: none; }

    /* ── SLIDE (default: portrait/mobile — full screen) ── */
    .slide {
      width: 100vw;
      height: 100dvh;
      flex-shrink: 0;
      border-radius: 0;
      box-shadow: none;
      overflow: hidden;
      background: #000;
      position: relative;
      scroll-snap-align: start;
    }

    /* Tablet & PC landscape: restore 16:9 card look with padding */
    @media (min-width: 768px) and (orientation: landscape),
           (min-width: 1024px) {
      .slides-container {
        gap: 16px;
        padding: 16px;
        align-items: center;
      }
      .slide {
        width: auto;
        height: calc(100dvh - 32px);
        aspect-ratio: 16 / 9;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        background: #fff;
        scroll-snap-align: center;
      }
    }

    /* Landscape phone (narrow height): full width, auto height */
    @media (max-height: 500px) and (orientation: landscape) {
      .slides-container {
        gap: 0;
        padding: 0;
      }
      .slide {
        width: 100vw;
        height: 100dvh;
        aspect-ratio: unset;
        border-radius: 0;
        box-shadow: none;
        scroll-snap-align: start;
      }
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
      display: block;
    }

    .slide-error {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #c0392b;
      font-size: 14px;
      padding: 20px;
      text-align: center;
    }

    .slide-number {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.3px;
      pointer-events: none;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    @media (min-width: 768px) {
      .slide-number { font-size: 13px; padding: 5px 12px; }
    }

    /* ── HAMBURGER ── */
    #hamburger {
      position: fixed;
      top: 14px;
      left: 14px;
      width: var(--hamburger-size);
      height: var(--hamburger-size);
      background: rgba(0,0,0,0.82);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 22px;
      z-index: 5000;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s;
    }
    #hamburger:active { background: rgba(0,0,0,0.95); }

    /* ── NAV BUTTONS ── */
    .nav-button {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: var(--nav-btn-size);
      height: var(--nav-btn-size);
      background: rgba(0,0,0,0.72);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 22px;
      z-index: 5000;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s, opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-button:active { background: rgba(0,0,0,0.95); }
    .nav-button.hidden { opacity: 0; pointer-events: none; }

    #prevBtn { left: 14px; }
    #nextBtn { right: 14px; }

    /* On small phones in portrait, hide nav buttons (use swipe) */
    @media (max-width: 480px) and (orientation: portrait) {
      #prevBtn, #nextBtn { display: none; }
    }

    /* ── SIDEBAR ── */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 5999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .sidebar-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: -300px;
      width: 280px;
      height: 100dvh;
      background: #fff;
      box-shadow: 6px 0 24px rgba(0,0,0,0.3);
      transition: left 0.35s cubic-bezier(.4,0,.2,1);
      z-index: 6000;
      display: flex;
      flex-direction: column;
    }
    .sidebar.open { left: 0; }

    @media (min-width: 768px) {
      .sidebar { width: 300px; }
    }

    .sidebar-header {
      padding: 20px 18px 12px;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
    }

    .sidebar-header h2 {
      font-size: 17px;
      font-weight: 600;
      color: #111;
      margin-bottom: 12px;
    }

    .sidebar-header input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      color: #222;
      background: #f8f8f8;
      transition: border 0.2s, background 0.2s;
    }
    .sidebar-header input:focus {
      border-color: #4a90e2;
      background: #fff;
    }

    #slideList {
      list-style: none;
      padding: 8px 0;
      overflow-y: auto;
      flex: 1;
      -webkit-overflow-scrolling: touch;
    }

    #slideList li {
      padding: 12px 18px;
      font-size: 14px;
      color: #333;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.15s;
      -webkit-tap-highlight-color: rgba(74,144,226,0.1);
    }
    #slideList li:hover { background: #f5f8ff; }
    #slideList li:active { background: #e8f0fe; }
    #slideList li.active { background: #e8f0fe; color: #1a56db; font-weight: 500; }
    #slideList li:last-child { border-bottom: none; }

    /* ── PROGRESS BAR ── */
    #progressBar {
      position: fixed;
      bottom: 0;
      left: 0;
      height: 3px;
      background: #4a90e2;
      z-index: 4999;
      transition: width 0.2s ease;
      border-radius: 0 3px 3px 0;
    }

    /* ── SLIDE COUNT TOOLTIP ── */
    #slideCounter {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      color: #fff;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      z-index: 4998;
      pointer-events: none;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <button id="hamburger" aria-label="Buka menu">☰</button>

  <div class="sidebar-overlay" id="overlay"></div>

  <div class="sidebar" id="sidebar" role="navigation" aria-label="Daftar slide">
    <div class="sidebar-header">
      <h2>Daftar Slide</h2>
      <input type="search" id="searchInput" placeholder="Cari slide..." autocomplete="off" aria-label="Cari slide">
    </div>
    <ul id="slideList" role="listbox" aria-label="Pilih slide"></ul>
  </div>

  <div class="slides-container" id="slides" role="main" aria-label="Area slide"></div>

  <button id="prevBtn" class="nav-button hidden" aria-label="Slide sebelumnya">&#8592;</button>
  <button id="nextBtn" class="nav-button" aria-label="Slide berikutnya">&#8594;</button>

  <div id="progressBar"></div>
  <div id="slideCounter" aria-live="polite">1 / 1</div>

  <script>
    const basePath = "gambar/";

    const slideImages = [
      { name: "Slide1.PNG",  path: basePath + "Slide1.PNG" },
      { name: "Slide2.PNG",  path: basePath + "Slide2.PNG" },
      { name: "Slide3.PNG",  path: basePath + "Slide3.PNG" },
      { name: "Slide4.PNG",  path: basePath + "Slide4.PNG" },
      { name: "Slide5.PNG",  path: basePath + "Slide5.PNG" },
      { name: "Slide6.PNG",  path: basePath + "Slide6.PNG" },
      { name: "Slide7.PNG",  path: basePath + "Slide7.PNG" },
      { name: "Slide8.PNG",  path: basePath + "Slide8.PNG" },
      { name: "Slide9.PNG",  path: basePath + "Slide9.PNG" },
      { name: "Slide10.PNG", path: basePath + "Slide10.PNG" },
      { name: "Slide11.PNG", path: basePath + "Slide11.PNG" },
      // Tambahkan sisanya di sini
    ];

    const container  = document.getElementById('slides');
    const sidebar    = document.getElementById('sidebar');
    const overlay    = document.getElementById('overlay');
    const searchInput = document.getElementById('searchInput');
    const slideList  = document.getElementById('slideList');
    const prevBtn    = document.getElementById('prevBtn');
    const nextBtn    = document.getElementById('nextBtn');
    const progressBar = document.getElementById('progressBar');
    const slideCounter = document.getElementById('slideCounter');
    const total      = slideImages.length;
    let currentIndex = 0;
    let scrolling    = false;

    // ── BUILD SLIDES ──
    slideImages.forEach((slide, index) => {
      const div = document.createElement('div');
      div.className = 'slide';
      div.dataset.index = index;

      const img = document.createElement('img');
      img.src = slide.path;
      img.alt = slide.name;
      img.loading = index < 3 ? 'eager' : 'lazy';
      img.onerror = () => {
        div.innerHTML = `<div class="slide-error">Gagal memuat:<br>${slide.name}</div>`;
      };

      const num = document.createElement('div');
      num.className = 'slide-number';
      num.textContent = `${index + 1} / ${total}`;

      div.appendChild(img);
      div.appendChild(num);
      container.appendChild(div);
    });

    // ── HELPERS ──
    function getSlideWidth() {
      const first = container.children[0];
      if (!first) return 0;
      const gap = parseFloat(getComputedStyle(container).gap) || 0;
      return first.offsetWidth + gap;
    }

    function updateUI(index) {
      currentIndex = Math.max(0, Math.min(index, total - 1));

      // progress bar
      progressBar.style.width = ((currentIndex + 1) / total * 100) + '%';

      // counter
      slideCounter.textContent = `${currentIndex + 1} / ${total}`;

      // nav buttons
      prevBtn.classList.toggle('hidden', currentIndex === 0);
      nextBtn.classList.toggle('hidden', currentIndex === total - 1);

      // sidebar active
      document.querySelectorAll('#slideList li').forEach((li, i) => {
        li.classList.toggle('active', i === currentIndex);
      });
    }

    function goToSlide(index, behavior = 'smooth') {
      const sw = getSlideWidth();
      if (!sw) return;
      container.scrollTo({ left: index * sw, behavior });
      updateUI(index);
    }

    // ── SCROLL LISTENER (debounced) ──
    let scrollTimer;
    container.addEventListener('scroll', () => {
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(() => {
        const sw = getSlideWidth();
        if (!sw) return;
        const idx = Math.round(container.scrollLeft / sw);
        updateUI(idx);
      }, 80);
    }, { passive: true });

    // ── NAV BUTTONS ──
    prevBtn.addEventListener('click', () => goToSlide(currentIndex - 1));
    nextBtn.addEventListener('click', () => goToSlide(currentIndex + 1));

    // ── HAMBURGER / OVERLAY ──
    function openSidebar() {
      sidebar.classList.add('open');
      overlay.classList.add('open');
      buildList('');
      searchInput.value = '';
      searchInput.focus();
    }
    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
    }

    document.getElementById('hamburger').addEventListener('click', () => {
      sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
    });
    overlay.addEventListener('click', closeSidebar);

    // ── SLIDE LIST ──
    function buildList(term) {
      slideList.innerHTML = '';
      slideImages
        .filter(s => s.name.toLowerCase().includes(term.toLowerCase()))
        .forEach((slide, i) => {
          const realIndex = slideImages.indexOf(slide);
          const li = document.createElement('li');
          li.textContent = `Slide ${realIndex + 1}`;
          li.setAttribute('role', 'option');
          li.dataset.index = realIndex;
          if (realIndex === currentIndex) li.classList.add('active');
          li.addEventListener('click', () => {
            goToSlide(realIndex);
            closeSidebar();
          });
          slideList.appendChild(li);
        });
    }

    searchInput.addEventListener('input', e => buildList(e.target.value));

    // ── KEYBOARD ──
    document.addEventListener('keydown', e => {
      if (sidebar.classList.contains('open')) {
        if (e.key === 'Escape') closeSidebar();
        return;
      }
      if (e.key === 'ArrowRight' || e.key === 'PageDown') goToSlide(currentIndex + 1);
      if (e.key === 'ArrowLeft'  || e.key === 'PageUp')   goToSlide(currentIndex - 1);
      if (e.key === 'Home') goToSlide(0);
      if (e.key === 'End')  goToSlide(total - 1);
    });

    // ── SWIPE (Touch) ──
    let touchStartX = 0, touchStartY = 0;
    container.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    // ── RESIZE: recalculate position ──
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        goToSlide(currentIndex, 'instant');
      }, 150);
    });

    // ── INIT ──
    window.addEventListener('load', () => {
      goToSlide(0, 'instant');
    });
  </script>
</body>
</html>
