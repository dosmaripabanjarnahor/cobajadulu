<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PPT Horizontal Scroll</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      overflow: hidden;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
      height: 100vh;
    }

    .slides-container {
      display: flex;
      flex-direction: row;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      height: 100vh;
      gap: 10px;
      padding: 10px 5px;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
    }

    .slide {
      height: 94vh;
      width: auto;
      aspect-ratio: 16 / 9;
      flex-shrink: 0;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
      overflow: hidden;
      background: white;
      position: relative;
      scroll-snap-align: center;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: white;
    }

    .slide-number {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 5px 11px;
      border-radius: 20px;
      font-size: 13.5px;
      z-index: 10;
    }

    #hamburger, .nav-button {
      position: fixed;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      border: none;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      font-size: 28px;
      z-index: 5000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      cursor: pointer;
    }

    #hamburger { top: 15px; left: 15px; }
    #prevBtn { top: 50%; left: 15px; transform: translateY(-50%); }
    #nextBtn { top: 50%; right: 15px; transform: translateY(-50%); }

    .sidebar {
      position: fixed;
      top: 0; left: -280px;
      width: 280px; height: 100vh;
      background: white;
      box-shadow: 4px 0 15px rgba(0,0,0,0.3);
      transition: left 0.4s ease;
      z-index: 6000;
      padding: 20px;
      overflow-y: auto;
    }
    .sidebar.open { left: 0; }
  </style>
</head>
<body>

  <button id="hamburger">☰</button>

  <div class="sidebar" id="sidebar">
    <h2>Daftar Slide</h2>
    <input type="text" id="searchInput" placeholder="Cari slide..." style="width:100%; padding:12px; margin:15px 0; border:1px solid #ddd; border-radius:8px;">
    <ul id="slideList" style="list-style:none; padding:0;"></ul>
  </div>

  <div class="slides-container" id="slides"></div>

  <button id="prevBtn" class="nav-button">←</button>
  <button id="nextBtn" class="nav-button">→</button>

  <script>
    const basePath = "gambar/";

    const slideImages = [
      { name: "Slide1.PNG", path: basePath + "Slide1.PNG" },
      { name: "Slide2.PNG", path: basePath + "Slide2.PNG" },
      { name: "Slide3.PNG", path: basePath + "Slide3.PNG" },
      { name: "Slide4.PNG", path: basePath + "Slide4.PNG" },
      { name: "Slide5.PNG", path: basePath + "Slide5.PNG" },
      { name: "Slide6.PNG", path: basePath + "Slide6.PNG" },
      { name: "Slide7.PNG", path: basePath + "Slide7.PNG" },
      { name: "Slide8.PNG", path: basePath + "Slide8.PNG" },
      { name: "Slide9.PNG", path: basePath + "Slide9.PNG" },
      { name: "Slide10.PNG", path: basePath + "Slide10.PNG" },
      { name: "Slide11.PNG", path: basePath + "Slide11.PNG" },
      // Tambahkan sisanya jika ada
    ];

    const container = document.getElementById('slides');
    let currentIndex = 0;

    slideImages.forEach((slide, index) => {
      const div = document.createElement('div');
      div.className = 'slide';
      div.innerHTML = `
        <img src="${slide.path}" alt="${slide.name}" 
             onerror="this.parentElement.innerHTML='<div style=\'color:red;padding:20px;text-align:center\'>Gagal memuat: ${slide.name}</div>'">
        <div class="slide-number">${index + 1} / ${slideImages.length}</div>
      `;
      container.appendChild(div);
    });

    function goToSlide(index) {
      currentIndex = index;
      const slideWidth = container.children[0].offsetWidth + 10;
      container.scrollTo({ left: index * slideWidth, behavior: 'smooth' });
    }

    container.addEventListener('scroll', () => {
      const slideWidth = container.children[0].offsetWidth + 10;
      currentIndex = Math.round(container.scrollLeft / slideWidth);
    });

    function scrollToSlide(dir) {
      const slideWidth = container.children[0].offsetWidth + 10;
      container.scrollBy({ left: dir * slideWidth, behavior: 'smooth' });
    }

    document.getElementById('nextBtn').onclick = () => scrollToSlide(1);
    document.getElementById('prevBtn').onclick = () => scrollToSlide(-1);
    document.getElementById('hamburger').onclick = () => document.getElementById('sidebar').classList.toggle('open');

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const list = document.getElementById('slideList');
      list.innerHTML = '';
      slideImages
        .filter(s => s.name.toLowerCase().includes(term))
        .forEach((slide, i) => {
          const li = document.createElement('li');
          li.textContent = `${i+1}. ${slide.name}`;
          li.style.padding = "12px 8px";
          li.style.borderBottom = "1px solid #eee";
          li.onclick = () => {
            goToSlide(i);
            document.getElementById('sidebar').classList.remove('open');
          };
          list.appendChild(li);
        });
    });

    document.addEventListener('keydown', e => {
      if (e.key === "ArrowRight") scrollToSlide(1);
      if (e.key === "ArrowLeft") scrollToSlide(-1);
    });
  </script>
</body>
</html>
